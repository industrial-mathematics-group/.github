# Reusable workflow: summarises the AI declarations in the history of the default branch
# and publishes three shields.io endpoint badges to the orphan branch "badges":
#   ai-generation.json    e.g. "G0 40% · G1 35% · G2 25%"
#   ai-human-review.json  e.g. "H1 30% · H2 60% · H3 10%"
#   ai-review.json        e.g. "A- 40% · A0 20% · A1 40%"
# Commits with the old V0-V3 trailers are mapped conservatively (unknown parts shown as "unknown").
# Only commits on the first-parent history that carry an AI-Generation trailer are counted
# (commits from before the policy are ignored; the count is shown in the job summary).
name: AI badge

on:
  workflow_call:

jobs:
  badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ai-badge-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count declarations
        run: |
          python3 - <<'PY'
          import json, math, os, re, subprocess
          from collections import Counter

          log = subprocess.run(
              ["git", "log", "--first-parent", "--format=%B%x00", "HEAD"],
              capture_output=True, text=True, check=True,
          ).stdout
          messages = [m for m in log.split("\x00") if m.strip()]

          def trailer_block(msg):
              """The trailer paragraph holding the declaration (GitHub may append a separate
              Co-authored-by paragraph after it, so trailing trailer-only paragraphs are skipped)."""
              paragraphs = [p for p in re.split(r"\n[ \t]*\n", msg.strip()) if p.strip()]
              for p in reversed(paragraphs):
                  lines = p.splitlines()
                  if not all(re.match(r"^[A-Za-z][A-Za-z0-9-]*:", l) for l in lines):
                      break
                  if any(re.match(r"^AI-Generation:", l, re.I) for l in lines):
                      return p
              return ""

          def trailer(block, key, pattern):
              m = re.search(rf"^{key}:[ \t]*({pattern})[ \t]*$", block, re.M | re.I)
              return m.group(1).upper() if m else None

          gen, hum, air = Counter(), Counter(), Counter()
          legacy = 0
          for msg in messages:
              msg = trailer_block(msg)
              g = trailer(msg, "AI-Generation", "G[0-3]")
              if not g:
                  continue
              h = trailer(msg, "Human-Review", "H[0-3]")
              a = trailer(msg, "AI-Review", "A-|A[0-3]")
              v = trailer(msg, "AI-Verification", "V[0-3]")
              if h is None and a is None and v:  # first version of the policy (V0-V3), mapped conservatively
                  legacy += 1
                  h = {"V0": "H2", "V3": "H2"}.get(v)
                  a = {"V1": "A1", "V2": "A2", "V3": "A1"}.get(v) or ("A-" if v == "V0" and g == "G0" else None)
              gen[g] += 1
              hum[h or "unknown"] += 1
              air[a or "unknown"] += 1
          declared = sum(gen.values())

          def percentages(counts):
              # largest-remainder method: integers that sum to exactly 100
              total = sum(counts.values())
              exact = {k: 100 * c / total for k, c in counts.items()}
              out = {k: math.floor(x) for k, x in exact.items()}
              for k in sorted(exact, key=lambda k: exact[k] - out[k], reverse=True)[: 100 - sum(out.values())]:
                  out[k] += 1
              return out

          def badge(label, counts, keys, color):
              shown = {k: counts[k] for k in keys if counts[k]}
              if not shown:
                  return {"schemaVersion": 1, "label": label, "message": "no declarations yet", "color": "lightgrey"}
              pct = percentages(shown)
              message = " · ".join(f"{k} {pct[k]}%" if pct[k] else f"{k} <1%" for k in shown)
              return {"schemaVersion": 1, "label": label, "message": message, "color": color}

          out = os.environ["RUNNER_TEMP"] + "/ai-badges/"
          os.makedirs(out, exist_ok=True)
          for name, label, counts, keys, color in (
              ("ai-generation.json", "AI generation", gen, ["G0", "G1", "G2", "G3"], "4063D8"),
              ("ai-human-review.json", "human review", hum, ["H0", "H1", "H2", "H3", "unknown"], "389826"),
              ("ai-review.json", "AI review", air, ["A-", "A0", "A1", "A2", "A3", "unknown"], "9558B2"),
          ):
              with open(out + name, "w") as f:
                  json.dump(badge(label, counts, keys, color), f, ensure_ascii=False)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write(f"### AI declarations\n\n{declared} of {len(messages)} commits on the default branch are declared")
              s.write(f" ({legacy} with the old V0-V3 trailers, mapped conservatively).\n\n" if legacy else ".\n\n")
              s.write("| Level | Commits |\n|---|---|\n")
              for counts in (gen, hum, air):
                  for k, n in sorted(counts.items()):
                      s.write(f"| {k} | {n} |\n")
          PY

      - name: Publish to the badges branch
        env:
          FILES: ai-generation.json ai-human-review.json ai-review.json
          SRC: ${{ runner.temp }}/ai-badges
          MESSAGE: Update AI declaration badges
        run: |
          # Other workflows (e.g. "AI file declarations") write other files to the same branch,
          # so a push can be rejected: start again from the newest branch tip and retry.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set -euo pipefail
          WT="$RUNNER_TEMP/badges-worktree"
          for attempt in 1 2 3 4 5; do
            cd "$GITHUB_WORKSPACE"
            rm -rf "$WT"; git worktree prune
            if git ls-remote --exit-code --heads origin badges >/dev/null; then
              git fetch -q origin badges
              git worktree add -q --detach "$WT" FETCH_HEAD
            else
              # unique local name; only the remote branch is called "badges"
              git worktree add -q --orphan -b "badges-new-$GITHUB_RUN_ID-$attempt" "$WT"
            fi
            for f in $FILES; do cp "$SRC/$f" "$WT/"; done
            cd "$WT"
            git add $FILES
            if git diff --cached --quiet; then echo "Badges unchanged."; exit 0; fi
            git commit -q -m "$MESSAGE"
            if git push -q origin HEAD:refs/heads/badges; then echo "Badges published."; exit 0; fi
            echo "Push rejected (attempt $attempt), retrying ..."; sleep $((attempt * 3))
          done
          echo "Could not publish the badges." >&2; exit 1
