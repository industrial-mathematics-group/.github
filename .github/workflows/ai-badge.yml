# Reusable workflow: summarises the AI declarations in the history of the default branch
# and publishes two shields.io endpoint badges to the orphan branch "badges":
#   ai-generation.json    e.g. "G0 40% · G1 35% · G2 25%"
#   ai-verification.json  e.g. "V0 60% · V3 40%"
# Only commits on the first-parent history that carry an AI-Generation trailer are counted
# (commits from before the policy are ignored; the count is shown in the job summary).
name: AI badge

on:
  workflow_call:

jobs:
  badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count declarations
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from collections import Counter

          log = subprocess.run(
              ["git", "log", "--first-parent", "--format=%B%x00", "HEAD"],
              capture_output=True, text=True, check=True,
          ).stdout
          messages = [m for m in log.split("\x00") if m.strip()]
          gen, ver = Counter(), Counter()
          for msg in messages:
              g = re.search(r"^AI-Generation:[ \t]*(G[0-3])[ \t]*$", msg, re.M | re.I)
              v = re.search(r"^AI-Verification:[ \t]*(V[0-3])[ \t]*$", msg, re.M | re.I)
              if g:
                  gen[g.group(1).upper()] += 1
                  ver[v.group(1).upper() if v else "undeclared"] += 1
          declared = sum(gen.values())

          def badge(label, counts, keys, color):
              if declared == 0:
                  return {"schemaVersion": 1, "label": label, "message": "no declarations yet", "color": "lightgrey"}
              parts, used = [], 0
              shown = [k for k in keys if counts[k]]
              for i, k in enumerate(shown):
                  # largest-remainder style: last entry takes the rest so the sum is 100 %
                  pct = 100 - used if i == len(shown) - 1 else round(100 * counts[k] / declared)
                  used += pct
                  parts.append(f"{k} {pct}%")
              return {"schemaVersion": 1, "label": label, "message": " · ".join(parts), "color": color}

          os.makedirs("out", exist_ok=True)
          with open("out/ai-generation.json", "w") as f:
              json.dump(badge("AI generation", gen, ["G0", "G1", "G2", "G3"], "4063D8"), f)
          with open("out/ai-verification.json", "w") as f:
              json.dump(badge("verification", ver, ["V0", "V1", "V2", "V3", "undeclared"], "389826"), f)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write(f"### AI declarations\n\n{declared} of {len(messages)} commits on the default branch are declared.\n\n")
              s.write("| Level | Commits |\n|---|---|\n")
              for k in ["G0", "G1", "G2", "G3", "V0", "V1", "V2", "V3"]:
                  s.write(f"| {k} | {(gen if k[0] == 'G' else ver)[k]} |\n")
          PY

      - name: Publish to the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges >/dev/null; then
            git fetch origin badges
            git worktree add /tmp/badges -B badges origin/badges
          else
            git worktree add --orphan -b badges /tmp/badges
          fi
          cp out/*.json /tmp/badges/
          cd /tmp/badges
          git add ai-generation.json ai-verification.json
          if git diff --cached --quiet; then
            echo "Badges unchanged."
          else
            git commit -m "Update AI declaration badges"
            git push origin badges
          fi
