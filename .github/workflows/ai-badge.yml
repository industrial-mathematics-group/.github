# Reusable workflow: summarises the AI declarations in the history of the default branch
# and publishes three shields.io endpoint badges to the orphan branch "badges":
#   ai-generation.json    e.g. "G0 40% · G1 35% · G2 25%"
#   ai-human-review.json  e.g. "H1 30% · H2 60% · H3 10%"
#   ai-review.json        e.g. "A0 40% · A1 20% · A2 40%"
# The declaration of a merged PR is read from its merge commit, whose message is the PR title
# and description (see SETUP.md): the ticked G, H and A questions of the PR template.
# Older commits declared with trailer lines (AI-Generation: ...) are read from those.
# Commits with the old V0-V3 trailers are mapped conservatively (unknown parts shown as "unknown").
# "AI-Review: A-" (previous scale) counts as A0. Commits up to the input previous-ai-scale-until
# (a commit SHA on main) are read on the previous AI review scale (A0 -> A1, A1 -> A2).
# Only commits on the first-parent history that carry a declaration are counted
# (commits from before the policy are ignored; the count is shown in the job summary).
name: AI badge

on:
  workflow_call:
    inputs:
      previous-ai-scale-until:
        description: Last commit on main whose AI-Review trailer uses the previous scale (A-, A0-A3)
        type: string
        default: ""

jobs:
  badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ai-badge-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count declarations
        env:
          PREVIOUS_SCALE_UNTIL: ${{ inputs.previous-ai-scale-until }}
        run: |
          python3 - <<'PY'
          import json, math, os, re, subprocess
          from collections import Counter

          log = subprocess.run(
              ["git", "log", "--first-parent", "--format=%H%n%B%x00", "HEAD"],
              capture_output=True, text=True, check=True,
          ).stdout
          entries = [m.strip("\n").split("\n", 1) for m in log.split("\x00") if m.strip()]
          entries = [(e[0], e[1] if len(e) > 1 else "") for e in entries]

          # commits up to (and including) this one use the previous AI review scale
          until = os.environ.get("PREVIOUS_SCALE_UNTIL", "").strip()
          old_scale = set()
          if until:
              shas = [sha for sha, _ in entries]
              full = subprocess.run(["git", "rev-parse", "--verify", until + "^{commit}"],
                                    capture_output=True, text=True).stdout.strip()
              if full not in shas:
                  raise SystemExit(f"previous-ai-scale-until: {until} is not a commit on the first-parent history of main")
              old_scale = set(shas[shas.index(full):])   # git log lists newest first
          OLD_AI = {"A-": "A0", "A0": "A1", "A1": "A2", "A2": "A2", "A3": "A3"}

          def trailer_block(msg):
              """The trailer paragraph holding the declaration (GitHub may append a separate
              Co-authored-by paragraph after it, so trailing trailer-only paragraphs are skipped)."""
              paragraphs = [p for p in re.split(r"\n[ \t]*\n", msg.strip()) if p.strip()]
              for p in reversed(paragraphs):
                  lines = p.splitlines()
                  if not all(re.match(r"^[A-Za-z][A-Za-z0-9-]*:", l) for l in lines):
                      break
                  if any(re.match(r"^AI-Generation:", l, re.I) for l in lines):
                      return p
              return ""

          def trailer(block, key, pattern):
              m = re.search(rf"^{key}:[ \t]*({pattern})[ \t]*$", block, re.M | re.I)
              return m.group(1).upper() if m else None

          def ticked_levels(msg):
              """G, H and A from the ticked questions of the PR template, or None if the message has
              no ticked G question. Like the PR check, it reads only top-level boxes outside HTML
              comments and fenced code blocks. The check made sure the ticks were valid at merge."""
              text = re.sub(r"<!--.*?(-->|\Z)", "", msg, flags=re.S)
              ticks, fence = {}, None
              for line in text.splitlines():
                  f = re.match(r"^ {0,3}(`{3,}|~{3,})", line)
                  if fence:
                      if f and f.group(1)[0] == fence[0] and len(f.group(1)) >= len(fence) and not line.strip(" `~"):
                          fence = None
                      continue
                  if f:
                      fence = f.group(1)
                      continue
                  m = re.match(r"^[-*] \[([ xX])\] \*\*([GHA][0-3])\*\*", line)
                  if m:
                      ticks[m.group(2)] = m.group(1) != " "
              g = [k for k in ("G0", "G1", "G2", "G3") if ticks.get(k)]
              if len(g) != 1:
                  return None
              h = None
              for k in ("H0", "H1", "H2", "H3"):
                  if not ticks.get(k):
                      break
                  h = k
              a = "A0"
              for k in ("A1", "A2", "A3"):
                  if ticks.get(k):
                      a = k
              return g[0], h, a

          gen, hum, air = Counter(), Counter(), Counter()
          legacy = boxes = 0
          for sha, msg in entries:
              levels = ticked_levels(msg)
              if levels:
                  g, h, a = levels
                  boxes += 1
                  gen[g] += 1
                  hum[h or "unknown"] += 1
                  air[a] += 1
                  continue
              msg = trailer_block(msg)
              g = trailer(msg, "AI-Generation", "G[0-3]")
              if not g:
                  continue
              h = trailer(msg, "Human-Review", "H[0-3]")
              a = trailer(msg, "AI-Review", "A-|A[0-3]")
              if a and sha in old_scale:
                  # a self-check of human-written content doesn't exist on the new scale
                  a = None if (a == "A0" and g == "G0") else OLD_AI[a]
              elif a == "A-":
                  a = "A0"
              v = trailer(msg, "AI-Verification", "V[0-3]")
              if h is None and a is None and v:  # first version of the policy (V0-V3), mapped conservatively
                  legacy += 1
                  h = {"V0": "H2", "V3": "H2"}.get(v)
                  a = {"V1": "A2", "V2": "A2", "V3": "A2"}.get(v) or ("A0" if v == "V0" and g == "G0" else None)
              gen[g] += 1
              hum[h or "unknown"] += 1
              air[a or "unknown"] += 1
          declared = sum(gen.values())

          def percentages(counts):
              # largest-remainder method: integers that sum to exactly 100
              total = sum(counts.values())
              exact = {k: 100 * c / total for k, c in counts.items()}
              out = {k: math.floor(x) for k, x in exact.items()}
              for k in sorted(exact, key=lambda k: exact[k] - out[k], reverse=True)[: 100 - sum(out.values())]:
                  out[k] += 1
              return out

          def badge(label, counts, keys, color):
              shown = {k: counts[k] for k in keys if counts[k]}
              if not shown:
                  return {"schemaVersion": 1, "label": label, "message": "no declarations yet", "color": "lightgrey"}
              pct = percentages(shown)
              message = " · ".join(f"{k} {pct[k]}%" if pct[k] else f"{k} <1%" for k in shown)
              return {"schemaVersion": 1, "label": label, "message": message, "color": color}

          out = os.environ["RUNNER_TEMP"] + "/ai-badges/"
          os.makedirs(out, exist_ok=True)
          for name, label, counts, keys, color in (
              ("ai-generation.json", "AI generation", gen, ["G0", "G1", "G2", "G3"], "4063D8"),
              ("ai-human-review.json", "human review", hum, ["H0", "H1", "H2", "H3", "unknown"], "389826"),
              ("ai-review.json", "AI review", air, ["A0", "A1", "A2", "A3", "unknown"], "9558B2"),
          ):
              with open(out + name, "w") as f:
                  json.dump(badge(label, counts, keys, color), f, ensure_ascii=False)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write(f"### AI declarations\n\n{declared} of {len(entries)} commits on the default branch are declared")
              notes = [f"{boxes} from the ticked questions of merged PRs"] if boxes else []
              if legacy:
                  notes.append(f"{legacy} with the old V0-V3 trailers, mapped conservatively")
              s.write(f" ({'; '.join(notes)}).\n\n" if notes else ".\n\n")
              s.write("| Level | Commits |\n|---|---|\n")
              for counts in (gen, hum, air):
                  for k, n in sorted(counts.items()):
                      s.write(f"| {k} | {n} |\n")
          PY

      - name: Publish to the badges branch
        env:
          FILES: ai-generation.json ai-human-review.json ai-review.json
          SRC: ${{ runner.temp }}/ai-badges
          MESSAGE: Update AI declaration badges
        run: |
          # Other workflows (e.g. "AI file declarations") write other files to the same branch,
          # so a push can be rejected: start again from the newest branch tip and retry.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set -euo pipefail
          WT="$RUNNER_TEMP/badges-worktree"
          for attempt in 1 2 3 4 5; do
            cd "$GITHUB_WORKSPACE"
            rm -rf "$WT"; git worktree prune
            if git ls-remote --exit-code --heads origin badges >/dev/null; then
              git fetch -q origin badges
              git worktree add -q --detach "$WT" FETCH_HEAD
            else
              # unique local name; only the remote branch is called "badges"
              git worktree add -q --orphan -b "badges-new-$GITHUB_RUN_ID-$attempt" "$WT"
            fi
            for f in $FILES; do cp "$SRC/$f" "$WT/"; done
            cd "$WT"
            git add $FILES
            if git diff --cached --quiet; then echo "Badges unchanged."; exit 0; fi
            git commit -q -m "$MESSAGE"
            if git push -q origin HEAD:refs/heads/badges; then echo "Badges published."; exit 0; fi
            echo "Push rejected (attempt $attempt), retrying ..."; sleep $((attempt * 3))
          done
          echo "Could not publish the badges." >&2; exit 1
