# Reusable workflow: derives the AI declaration of a pull request from the ticked questions
# of the PR template, validates it and sets labels.
# Called from each repository (see workflow-templates/ai-declaration.yml).
#
# Rules (see CONTRIBUTING.md, "AI-assisted contributions"):
#   G0-G3     exactly one ticked
#   H0-H3     at least H0; the levels build on each other
#   A1-A3     the highest ticked one counts, none ticked is A0
#   models    at least one for G1-G3 (a listed family or "Other: <name>"), none for G0
#   A3        names the reviewing model after "Model:"
#   Reviewed-by is the PR author, or the "Responsible person: @login" line for PRs opened by bots.
#   G1-G3 need at least A1; G0 can't be A1 (no generating session to check itself).
#   A [policy] table in the repository's SIGNOFF.toml (formerly AIDECL.toml) can require more.
#   The declaration travels into git through the merge commit, whose message is the PR
#   title and description (see SETUP.md); the "AI badge" workflow reads it from there.
#
# Security: runs on pull_request_target so it can label PRs from forks. It only reads the PR
# description and the SIGNOFF.toml (or AIDECL.toml) of the BASE branch; it never checks out or runs code from the PR.
name: AI declaration

on:
  workflow_call:

jobs:
  check:
    # Dependency update bots are exempt: Dependabot, and github-actions[bot] for CompatHelper.
    # A skipped required check counts as passed, so other bots and AI agents must declare like everyone else.
    if: ${{ !contains(fromJSON('["dependabot[bot]", "github-actions[bot]"]'), github.event.pull_request.user.login) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Read the policy from the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            SIGNOFF.toml
            AIDECL.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Parse [policy]
        id: policy
        run: |
          python3 - <<'PY'
          import json, os, sys, tomllib
          policy = {}
          # SIGNOFF.toml; AIDECL.toml is its name from before aidecl became aisignoff
          name = next((n for n in ("SIGNOFF.toml", "AIDECL.toml") if os.path.exists(n)), None)
          if name:
              try:
                  data = tomllib.load(open(name, "rb"))
              except tomllib.TOMLDecodeError as e:
                  sys.exit(f"{name} on the base branch is not valid TOML: {e}")
              policy = data.get("policy", {}) or {}
              if not isinstance(policy, dict):
                  sys.exit(f"{name}: [policy] must be a table")
              if data.get("version") == 2:
                  # not migrated yet: the AI review scale moved up by one (A- -> A0, A0 -> A1, A1 -> A2)
                  print(f"{name} on the base branch is version 2; reading its policy on the old AI review scale. "
                        "Run 'aisignoff migrate' to convert it.")
                  old = {"A-": "A0", "A0": "A1", "A1": "A2", "A2": "A2", "A3": "A3"}
                  for req in policy.values():
                      if isinstance(req, dict) and req.get("ai") in old:
                          req["ai"] = old[req["ai"]]
              for gen, req in policy.items():
                  if gen != "*" and gen not in ("G0", "G1", "G2", "G3"):
                      sys.exit(f"{name} [policy]: unknown key '{gen}' (use \"*\", G0-G3)")
                  if not isinstance(req, dict) or set(req) - {"human", "ai"}:
                      sys.exit(f"{name} [policy].{gen} must be a table with 'human' and/or 'ai'")
                  if req.get("human", "H0") not in ("H0", "H1", "H2", "H3"):
                      sys.exit(f"{name} [policy].{gen}.human must be H0-H3")
                  if req.get("ai", "A0") not in ("A0", "A1", "A2", "A3"):
                      sys.exit(f"{name} [policy].{gen}.ai must be A0-A3")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"json={json.dumps(policy)}\n")
          print("Policy:", json.dumps(policy) if policy else "none (defaults)")
          PY

      - name: Validate declaration and set labels
        uses: actions/github-script@v7
        env:
          POLICY: ${{ steps.policy.outputs.json }}
        with:
          script: |
            // Derives the AI declaration of a PR from the ticked questions of the template.
            // Returns { errors, warnings, g, h, a, assistedBy, aiReviewedBy, reviewedBy }.
            function declare(body, author, policy) {
              body = (body || '').replace(/\r\n?/g, '\n');
              const errors = [], warnings = [];

              const LEVELS = { G: ['G0', 'G1', 'G2', 'G3'], H: ['H0', 'H1', 'H2', 'H3'], A: ['A0', 'A1', 'A2', 'A3'] };
              const rank = (level) => LEVELS[level[0]].indexOf(level);
              // The model questions of the template: label in the template -> name in the declaration.
              const MODELS = {
                'Claude Fable': 'Claude Fable (Anthropic)',
                'Claude Opus': 'Claude Opus (Anthropic)',
                'Claude Sonnet': 'Claude Sonnet (Anthropic)',
                'GPT Astra': 'GPT Astra (OpenAI)',
                'GPT Sol': 'GPT Sol (OpenAI)',
                'GPT Terra': 'GPT Terra (OpenAI)',
              };

              // ---------- what is visible ----------
              // Only what is visible in the rendered PR counts: HTML comments and fenced code
              // blocks are removed, and only top-level (not indented) checkboxes are read.
              const visible = [];
              let fence = null, inComment = false;
              for (const line of body.split('\n')) {
                if (fence) {
                  const f = line.match(/^ {0,3}(`{3,}|~{3,})\s*$/);
                  if (f && f[1][0] === fence[0] && f[1].length >= fence.length) fence = null;
                  continue;
                }
                if (inComment) {
                  if (line.includes('-->')) inComment = false;
                  continue;
                }
                const f = line.match(/^ {0,3}(`{3,}|~{3,})/);
                if (f) { fence = f[1]; continue; }
                // comments outside inline code; an unclosed one hides everything up to its end
                let rest = line.replace(/`[^`]*`/g, '').replace(/<!--[\s\S]*?-->/g, '');
                const open = rest.indexOf('<!--');
                if (open >= 0) { inComment = true; rest = rest.slice(0, open); }
                visible.push(rest);
              }

              // The trailer block of the previous template is no longer read; a leftover one would
              // look like a declaration but count for nothing.
              const OLD = /^(AI-Generation|Human-Review|AI-Review|Assisted-by|AI-Reviewed-by|Reviewed-by|AI-Verification|Verified-by|Tested-by):/i;
              const old = visible.map(l => l.match(OLD)).find(Boolean);
              if (old) errors.push(`The declaration lines at the end ("${old[1]}: ...") are no longer used: the check reads the ticked questions only. Delete those lines.`);

              // ---------- the questions ----------
              const ticks = {}, text = {}, models = {};
              for (const line of visible) {
                const m = line.match(/^[-*] \[( |x|X)\] \*\*([^*]+)\*\*(.*)$/);
                if (!m) continue;
                const ticked = m[1] !== ' ', label = m[2].trim(), rest = m[3];
                if (/^[GHA][0-3]$/.test(label)) {
                  if (label in ticks) errors.push(`The question ${label} appears more than once; keep the template's questions as they are.`);
                  ticks[label] = ticked;
                  const t = rest.match(/\bModel(?:, if not one of the above)?:(.*)$/);
                  if (t) text[label] = t[1].trim();
                } else if (label in MODELS) {
                  models[label] = ticked;
                } else if (/^Other:?$/.test(label)) {
                  const name = rest.replace(/^:/, '').trim();
                  if (ticked && !name) errors.push('You ticked "Other" under the AI models; write the tool and model after it, e.g. "Gemini 3 Pro (Google)".');
                  else if (!ticked && name) warnings.push(`"Other: ${name}" is not ticked, so it isn't declared. Tick it if this model wrote part of the change.`);
                  if (ticked && name) models[`Other: ${name}`] = name;
                }
              }
              if ('A0' in ticks) errors.push('The AI review questions of the PR template have changed (there is no A0 question any more). Copy the "AI declaration" section from the current template and tick what applies.');
              const missing = (keys) => {
                const m = keys.filter(k => !(k in ticks));
                if (m.length) errors.push(`The questions ${m.join(', ')} from the PR template are missing. Copy the "AI declaration" section back from the template and tick what applies.`);
                return m.length > 0;
              };

              // G: exactly one
              let g = null;
              if (!missing(LEVELS.G)) {
                const ticked = LEVELS.G.filter(k => ticks[k]);
                if (ticked.length === 1) g = ticked[0];
                else if (!ticked.length) errors.push('Tick one generation level, G0-G3.');
                else errors.push(`Tick exactly one generation level (ticked: ${ticked.join(', ')}); choose the highest that applies to any substantial part.`);
              }

              // H: the levels build on each other
              let h = null;
              if (!missing(LEVELS.H)) {
                for (const k of LEVELS.H) { if (ticks[k]) h = k; else break; }
                const gap = LEVELS.H.find((k, i) => ticks[k] && LEVELS.H.slice(0, i).some(j => !ticks[j]));
                if (gap) { errors.push(`You ticked ${gap} but not every level below it; the human review levels build on each other.`); h = null; }
                else if (!h) errors.push('Tick at least H0: a human review is required for every change.');
              }

              // A: the highest ticked one counts. A review by a new session (A2) or a different model (A3)
              // counts even if the generating session didn't check itself.
              let a = null;
              const aKeys = ['A1', 'A2', 'A3'];
              if (!missing(aKeys)) {
                a = 'A0';
                for (const k of aKeys) if (ticks[k]) a = k;
                if (g === 'G0' && ticks.A1) {
                  errors.push('A1 (self-check) is for AI-written changes; for a human-written change (G0) any AI review is A2 or A3. Untick A1.');
                  a = null;
                }
              }

              // ---------- names ----------
              const assistedBy = Object.entries(models).filter(([, v]) => v).map(([k, v]) => k in MODELS ? MODELS[k] : v);
              if (g && g !== 'G0' && !assistedBy.length) errors.push(`${g} needs the AI model(s) that wrote parts of the change: tick them, or "Other" with the name.`);
              if (g === 'G0' && assistedBy.length) errors.push('G0 means no AI was used, so untick the AI models (or choose G1-G3).');

              const aiReviewedBy = [];
              const writers = assistedBy.length ? assistedBy.join(', ') : null;
              if (a === 'A1' && writers) aiReviewedBy.push(`${writers}, self-check by the generating session`);
              if (a === 'A2') {
                const by = text.A2 || writers;
                if (!by) errors.push('A2: name the reviewing model after "Model, if not one of the above:".');
                else aiReviewedBy.push(`${by}, new session`);
              }
              if (a === 'A3') {
                if (!text.A3) errors.push('A3: name the reviewing model after "Model:" (a different model from the one that wrote the change).');
                else aiReviewedBy.push(`${text.A3}, extensive review or benchmark`);
              }
              for (const k of ['A2', 'A3']) {
                if (text[k] && !ticks[k]) warnings.push(`A model is named after ${k}, but ${k} isn't ticked, so it isn't declared.`);
              }

              // ---------- the responsible human ----------
              let reviewedBy = null;
              const resp = visible.map(l => l.match(/^[-*] \[( |x|X)\] I take responsibility/)).find(Boolean);
              if (!resp || resp[1] === ' ') errors.push('Please tick "I take responsibility for this change" (from the PR template).');
              const named = visible.map(l => l.match(/^\s*Responsible person:\s*@?([A-Za-z0-9-]+)\s*$/i)).find(Boolean);
              if (author.type === 'Bot') {
                if (named) reviewedBy = named[1];
                else errors.push(`This PR was opened by the bot account ${author.login}, which can't take responsibility. Add a line "Responsible person: @login" naming the human who does.`);
              } else {
                reviewedBy = author.login;
                if (named && named[1].toLowerCase() !== author.login.toLowerCase()) {
                  warnings.push(`"Responsible person" is only read for PRs opened by bots; the responsible human is the author, ${author.login}.`);
                }
              }

              // ---------- minimum levels ----------
              if (g && h && a) {
                const req = { ...(policy['*'] || {}), ...(policy[g] || {}) };
                let minA = req.ai;
                if (g !== 'G0' && (!minA || rank(minA) < rank('A1'))) minA = 'A1';
                if (g === 'G0' && minA === 'A1') minA = 'A2';   // no self-check for human-written content
                if (req.human && rank(h) < rank(req.human)) errors.push(`${g} requires at least ${req.human} in this repository (ticked ${h}).`);
                if (minA && rank(a) < rank(minA)) errors.push(g !== 'G0' && minA === 'A1'
                  ? `AI-written content (${g}) must at least be self-checked: tick A1 or higher (ticked ${a}).`
                  : `${g} requires at least ${minA} in this repository (ticked ${a}).`);
              }

              return { errors, warnings, g, h, a, assistedBy, aiReviewedBy, reviewedBy };
            }

            const pr = context.payload.pull_request;
            const { errors, warnings, g, h, a, assistedBy, aiReviewedBy, reviewedBy } =
              declare(pr.body, pr.user, JSON.parse(process.env.POLICY || '{}'));
            for (const w of warnings) core.warning(w);

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const isAiLabel = (name) => /^(ai:G[0-3]|human:H[0-3]|ai-review:A[-0-3]|verified:V[0-3])$/.test(name);
            const currentLabels = async () =>
              (await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number, per_page: 100 })).data.map(l => l.name);


            const summary = core.summary.addHeading('AI declaration', 3);
            if (errors.length) {
              // labels from an earlier, valid version of the description no longer apply
              for (const name of (await currentLabels()).filter(isAiLabel)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              }
              summary.addList(errors).addRaw('See CONTRIBUTING.md, section "AI-assisted contributions".').write();
              core.setFailed(errors.join('\n'));
              return;
            }
            // The declaration derived from the ticks, in the form of the aisignoff keys (e.g. for SIGNOFF.toml).
            const declaration = [
              `AI-Generation: ${g}`, `Human-Review: ${h}`, `AI-Review: ${a}`,
              ...assistedBy.map(m => `Assisted-by: ${m}`),
              ...aiReviewedBy.map(m => `AI-Reviewed-by: ${m}`),
              `Reviewed-by: ${reviewedBy}`,
            ].join('\n');
            await summary.addTable([
              [{ data: 'Generation', header: true }, { data: 'Human review', header: true }, { data: 'AI review', header: true }],
              [g, h, a],
            ]).addCodeBlock(declaration);
            if (warnings.length) summary.addList(warnings);
            await summary.write();


            // ---------- labels ----------
            const info = {
              G0: ['389826', 'Human-written'], G1: ['4063D8', 'AI-assisted'], G2: ['9558B2', 'AI-generated'], G3: ['CB3C33', 'AI-autonomous'],
              H0: ['C9D1E4', 'Human: plausibility check'], H1: ['9AA3B8', 'Human: tested'], H2: ['5A6378', 'Human: reviewed line by line'], H3: ['1B2238', 'Human: independently validated'],
              A0: ['EDEDED', 'No AI review'], A1: ['F3E0C2', 'AI: self-check'], A2: ['E8B86D', 'AI: review by a new session'], A3: ['8A5A0B', 'AI: extensive review or benchmark by a different model'],
            };
            const wanted = [`ai:${g}`, `human:${h}`, `ai-review:${a}`];
            for (const name of wanted) {
              const level = name.split(':')[1];
              const [color, description] = info[level];
              let existing = null;
              try {
                existing = (await github.rest.issues.getLabel({ owner, repo, name })).data;
              } catch (e) {
                if (e.status !== 404) throw e;
              }
              if (!existing) {
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              } else if (existing.description !== description || existing.color.toLowerCase() !== color.toLowerCase()) {
                // e.g. ai-review:A1 from the previous scale, where it meant "independent session"
                await github.rest.issues.updateLabel({ owner, repo, name, color, description });
              }
            }
            for (const name of await currentLabels()) {
              if (isAiLabel(name) && !wanted.includes(name)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              }
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: wanted });
