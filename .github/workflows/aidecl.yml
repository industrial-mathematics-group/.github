# Deprecated: renamed to file-signoff.yml. This wrapper keeps callers of the old name working;
# switch the caller to the new name (see SETUP.md, "Renamed workflows"). Removed in a later cleanup.
name: AI file declarations (deprecated, use File-signoff)

on:
  workflow_call:
    inputs:
      aidecl-ref:
        description: Git ref of aisignoff to install (now aisignoff-ref in file-signoff.yml)
        type: string
        default: main
      weight:
        description: Badge weighting, "files" or "lines"
        type: string
        default: files

jobs:
  aidecl:
    permissions:
      contents: write
    uses: industrial-mathematics-group/.github/.github/workflows/file-signoff.yml@main
    with:
      aisignoff-ref: ${{ inputs.aidecl-ref }}
      weight: ${{ inputs.weight }}
