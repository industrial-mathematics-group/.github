# Reusable workflow: the @claude assistant.
# Answers "@claude" in issues, issue comments and PR review comments, and works on
# issues opened from the "Ask Claude" issue forms. Claude pushes a branch and posts a
# "Create PR" link; a human opens and merges the pull request.
#
# Called from each repository (see workflow-templates/claude.yml). Setup: SETUP.md,
# section "The @claude assistant". Claude's org-wide instructions: claude/ORG-GUIDE.md.
#
# Security: claude-code-action only acts for users with write access to the repository,
# and never approves or merges pull requests.
name: Claude

on:
  workflow_call:
    inputs:
      model:
        description: Model ID passed to Claude Code
        type: string
        default: claude-sonnet-5-5
      model-name:
        description: Model as it is declared (Assisted-by, PR template), e.g. "Claude Sonnet 5.5 (Anthropic)"
        type: string
        default: Claude Sonnet 5.5 (Anthropic)
      node-version:
        description: Set up Node.js in this version (e.g. "22" for the Astro website); empty for none
        type: string
        default: ""
      max-turns:
        description: Upper limit of agent turns per run (cost guard)
        type: number
        default: 40
      aidecl-ref:
        description: Git ref (tag, branch or commit) of aidecl to install
        type: string
        default: main
      guide-ref:
        description: Git ref of industrial-mathematics-group/.github to read claude/ORG-GUIDE.md from
        type: string
        default: main
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One run at a time per issue or PR; a second request waits instead of racing on the same branch.
    concurrency:
      group: claude-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write   # token exchange for the Claude GitHub App
      actions: read     # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install aidecl
        env:
          REF: ${{ inputs.aidecl-ref }}
        run: pip install "aidecl @ git+https://github.com/industrial-mathematics-group/aidecl@${REF}"

      - name: Set up Node.js
        if: inputs.node-version != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Load the org guide and PR template
        # Claude Code reads ~/.claude/CLAUDE.md in addition to the repository's own CLAUDE.md.
        # Kept outside the checkout so it can never be committed by accident.
        env:
          REF: ${{ inputs.guide-ref }}
          MODEL_NAME: ${{ inputs.model-name }}
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/industrial-mathematics-group/.github/${REF}"
          mkdir -p ~/.claude/org
          curl -fsSL "$base/claude/ORG-GUIDE.md" -o ~/.claude/CLAUDE.md
          curl -fsSL "$base/.github/PULL_REQUEST_TEMPLATE.md" -o ~/.claude/org/PULL_REQUEST_TEMPLATE.md
          {
            echo
            echo "## This run"
            echo
            echo "- You are running as: $MODEL_NAME. Use exactly this name in Assisted-by and AI-Reviewed-by."
            echo "- The organisation's default PR template is at ~/.claude/org/PULL_REQUEST_TEMPLATE.md."
          } >> ~/.claude/CLAUDE.md

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max-turns }}
            --allowedTools "Bash(aidecl:*),Bash(git:*),Bash(ls:*),Bash(cat:*),Bash(find:*),Bash(grep:*),Bash(python3:*),Bash(npm ci),Bash(npm install),Bash(npm run:*),Bash(npx astro:*)"
