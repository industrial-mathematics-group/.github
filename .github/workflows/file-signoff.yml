# Reusable workflow: file-level AI declarations with aisignoff (SIGNOFF.toml).
#   lint  every push, pull request and merge queue run: fails if a file (or, with [history], a line) has no
#         valid declaration; writes the level mix per folder to the job summary and uploads the interactive
#         folder report as an artifact. On pushes to the default branch (and manual runs there) it also
#         publishes aisignoff-generation.json, aisignoff-human-review.json, aisignoff-ai-review.json and
#         aisignoff-findings.json to the orphan branch "badges", also when the check fails.
# A repository without SIGNOFF.toml is skipped with a warning: set it up with IMGAgent or "aisignoff init".
# The report as a website belongs in the repository's documentation: the Zensical docs workflow adds it to the
# site, and a Julia package writes it into its Documenter docs (see SETUP.md).
# aisignoff's version is the organisation's (actions/setup-aisignoff), unless the input aisignoff-version sets one.
# Called from each repository (see workflow-templates/file-signoff.yml).
name: File-signoff

on:
  workflow_call:
    inputs:
      aisignoff-version:
        description: Release of aisignoff to install from PyPI; empty (the default) is the organisation's version
        type: string
        default: ""
      weight:
        description: Badge weighting, "files" or "lines"
        type: string
        default: files
      # Deprecated, without effect; kept so that callers that still pass them don't fail to start.
      setup:
        description: "Deprecated: no effect (set aisignoff up with IMGAgent or 'aisignoff init')"
        type: boolean
        required: false
      setup-recheck:
        description: "Deprecated: no effect"
        type: string
        required: false
      setup-history:
        description: "Deprecated: no effect"
        type: boolean
        required: false
      pages:
        description: "Deprecated: no effect (put the report into the documentation site, see SETUP.md)"
        type: boolean
        required: false
      pages-path:
        description: "Deprecated: no effect"
        type: string
        required: false
      runs-on:
        description: >-
          Runner for the job: a label such as ubuntu-latest (the default) or aisignoff (a self-hosted runner),
          or JSON for several labels or a runner group, e.g. ["self-hosted", "aisignoff"]; empty is ubuntu-latest.
          See SETUP.md, "Self-hosted runner".
        type: string
        default: ubuntu-latest

jobs:
  lint:
    runs-on: ${{ (startsWith(inputs.runs-on, '[') || startsWith(inputs.runs-on, '{')) && fromJSON(inputs.runs-on) || inputs.runs-on || 'ubuntu-latest' }}
    permissions:
      contents: write   # the badges branch, on pushes to the default branch only
    concurrency:
      # one run at a time per ref, so the badges of an older push never land after a newer one's
      group: file-signoff-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      PUBLISH: >-
        ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - name: Deprecated inputs
        if: inputs.pages || inputs.setup-recheck != '' || inputs.pages-path != ''
        run: |
          echo "::warning title=File-signoff::The inputs pages, pages-path, setup, setup-recheck and setup-history no longer do anything; remove them from the caller. The report goes into the documentation site (see SETUP.md in industrial-mathematics-group/.github)."
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # the badges are pushed with the job's token; nothing of the repository is run
          persist-credentials: ${{ env.PUBLISH == 'true' }}
      - name: Look for SIGNOFF.toml
        id: config
        run: |
          # AIDECL.toml (never converted) counts as set up: lint then says how to convert it
          if [ -f SIGNOFF.toml ] || [ -f AIDECL.toml ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            MSG="This repository has no SIGNOFF.toml yet: aisignoff isn't set up, so no files are checked."
            HOW="Write '@IMGAgent signoff' in an issue to set it up, or run 'aisignoff init' and commit SIGNOFF.toml."
            echo "::warning title=aisignoff not set up::$MSG $HOW"
            { echo '### AI signoff'; echo; echo "$MSG $HOW"; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: industrial-mathematics-group/.github/actions/setup-aisignoff@main
        if: steps.config.outputs.configured == 'true'
        with:
          version: ${{ inputs.aisignoff-version }}
          # only runs on the default branch write the cache, the one every other run starts from
          cache: ${{ env.PUBLISH == 'true' && 'true' || 'restore' }}
      - name: Summary and folder report
        if: steps.config.outputs.configured == 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          { echo '### AI signoff'; aisignoff report --tree --markdown --depth 3 || true; } >> "$GITHUB_STEP_SUMMARY"
          # outside the work tree, or lint would count it as an undeclared file; in a pull request, the lines
          # it changes are marked: since the merge preview's first parent, the base branch as this run merged it
          SINCE=""
          if [ "$EVENT" = pull_request ]; then SINCE=HEAD^1; fi
          aisignoff report --html "$RUNNER_TEMP/aisignoff-report.html" --with-source ${SINCE:+--since "$SINCE"} || true
      - uses: actions/upload-artifact@v7
        if: steps.config.outputs.configured == 'true'
        with:
          name: aisignoff-report
          path: ${{ runner.temp }}/aisignoff-report.html
      - name: Check declarations
        if: steps.config.outputs.configured == 'true'
        run: aisignoff lint
      # The badges also when the check failed, so that they show the undeclared share.
      - name: Build badges
        if: ${{ !cancelled() && steps.config.outputs.configured == 'true' && env.PUBLISH == 'true' }}
        env:
          WEIGHT: ${{ inputs.weight }}
        run: aisignoff badge --out "$RUNNER_TEMP/aisignoff-badges" --weight "$WEIGHT"
      - uses: industrial-mathematics-group/.github/actions/publish-badges@main
        if: ${{ !cancelled() && steps.config.outputs.configured == 'true' && env.PUBLISH == 'true' }}
        with:
          files: aisignoff-generation.json aisignoff-human-review.json aisignoff-ai-review.json aisignoff-findings.json
          source: ${{ runner.temp }}/aisignoff-badges
          message: Update AI file declaration badges
