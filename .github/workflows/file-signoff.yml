# Reusable workflow: file-level AI declarations with aisignoff (SIGNOFF.toml).
#   lint    every push, pull request and merge queue run: fails if a file (or, with [history], a line)
#           has no valid declaration; writes the level mix per folder to the job summary and uploads
#           the interactive folder report as an artifact
#   badges  pushes to the default branch: publishes aisignoff-generation.json,
#           aisignoff-human-review.json and aisignoff-ai-review.json to the orphan branch "badges"
# Called from each repository (see workflow-templates/file-signoff.yml).
name: File-signoff

on:
  workflow_call:
    inputs:
      aisignoff-version:
        description: Release of aisignoff to install from PyPI (pinned, so a new release can't change the check unannounced)
        type: string
        default: "1.0.0rc7"
      weight:
        description: Badge weighting, "files" or "lines"
        type: string
        default: files

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install aisignoff
        env:
          VERSION: ${{ inputs.aisignoff-version }}
        run: pip install "aisignoff==${VERSION}"
      - name: Summary and folder report
        env:
          EVENT: ${{ github.event_name }}
        run: |
          { echo '### AI signoff'; aisignoff report --tree --markdown --depth 3 || true; } >> "$GITHUB_STEP_SUMMARY"
          # outside the work tree, or lint would count it as an undeclared file; in a pull request, the lines
          # it changes are marked: since the merge preview's first parent, the base branch as this run merged it
          SINCE=""
          if [ "$EVENT" = pull_request ]; then SINCE=HEAD^1; fi
          aisignoff report --html "$RUNNER_TEMP/aisignoff-report.html" --with-source ${SINCE:+--since "$SINCE"} || true
      - uses: actions/upload-artifact@v4
        with:
          name: aisignoff-report
          path: ${{ runner.temp }}/aisignoff-report.html
      - name: Check declarations
        run: aisignoff lint

  badges:
    # Also runs when lint fails, so the badge shows the undeclared share; skipped when cancelled.
    if: >-
      !cancelled() && github.event_name != 'pull_request' && github.event_name != 'merge_group' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: aisignoff-badges-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install aisignoff
        env:
          VERSION: ${{ inputs.aisignoff-version }}
        run: pip install "aisignoff==${VERSION}"
      - name: Build badges
        env:
          WEIGHT: ${{ inputs.weight }}
        run: aisignoff badge --out "$RUNNER_TEMP/aisignoff-badges" --weight "$WEIGHT"
      - name: Publish to the badges branch
        env:
          FILES: aisignoff-generation.json aisignoff-human-review.json aisignoff-ai-review.json
          SRC: ${{ runner.temp }}/aisignoff-badges
          MESSAGE: Update AI file declaration badges
        run: |
          # Other workflows (e.g. "Signoff-Badges") write other files to the same branch,
          # so a push can be rejected: start again from the newest branch tip and retry.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set -euo pipefail
          WT="$RUNNER_TEMP/badges-worktree"
          for attempt in 1 2 3 4 5; do
            cd "$GITHUB_WORKSPACE"
            rm -rf "$WT"; git worktree prune
            if git ls-remote --exit-code --heads origin badges >/dev/null; then
              git fetch -q origin badges
              git worktree add -q --detach "$WT" FETCH_HEAD
            else
              # unique local name; only the remote branch is called "badges"
              git worktree add -q --orphan -b "badges-new-$GITHUB_RUN_ID-$attempt" "$WT"
            fi
            for f in $FILES; do cp "$SRC/$f" "$WT/"; done
            cd "$WT"
            git add $FILES
            if git diff --cached --quiet; then echo "Badges unchanged."; exit 0; fi
            git commit -q -m "$MESSAGE"
            if git push -q origin HEAD:refs/heads/badges; then echo "Badges published."; exit 0; fi
            echo "Push rejected (attempt $attempt), retrying ..."; sleep $((attempt * 3))
          done
          echo "Could not publish the badges." >&2; exit 1
