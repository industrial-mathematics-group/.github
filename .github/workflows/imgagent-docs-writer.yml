# Reusable workflow: IMGAgent writes or refreshes a repository's docs/ from its code with Claude and opens a
# pull request. Called from each repository's IMGAgent caller (workflow-templates/imgagent.yml) for
#   @IMGAgent docs make      rebuild the whole site from the code (replaces every page in docs/)
#   @IMGAgent docs update    fix only what is outdated or missing, keeping everything else as it is
# at the start of an issue or pull request comment. Text after the command is passed to Claude as a hint,
# e.g. "@IMGAgent docs update the slurm add-on gained new options". Moved here from agent-sandbox's
# docs-writer.yml; the script is imgagent/docs/write_docs.py in this repository.
#
# The repository needs a Zensical site: docs/ and a zensical.toml with a nav = [ ... ] block. The result is
# committed to a new branch imgagent/docs-<command>-<run id> and opened as a pull request; nothing is pushed
# to the default branch. As the IMGAgent app, the pull request starts the repository's checks like anyone's.
# Without the app it is opened by github-actions[bot], which needs "Allow GitHub Actions to create and approve
# pull requests" and starts no other workflows.
#
# Security: the caller only starts it for people with write access and never for bots. The comment is passed
# through environment variables, never pasted into a shell with ${{ }}. The repository's code is read, not run.
name: IMGAgent docs writer

on:
  workflow_call:
    inputs:
      command:
        description: The command prefix as it is written in the comment, followed by make or update
        type: string
        default: "@IMGAgent docs"
      model:
        description: Claude model ID
        type: string
        default: claude-opus-5-5
      effort:
        description: How hard the model thinks (low, medium, high, xhigh, max)
        type: string
        default: medium
      project-name:
        description: The project's name for Claude; default the repository's name
        type: string
        default: ""
      project-about:
        description: One sentence on what the project is; default the repository's description
        type: string
        default: ""
      audience:
        description: Who reads the docs, e.g. "people who deploy and run it on their own Linux machines"
        type: string
        default: ""
      bot-ref:
        description: Git ref of industrial-mathematics-group/.github to read imgagent/docs/write_docs.py from
        type: string
        default: main
      app-id:
        description: ID of the IMGAgent GitHub App (with the secret app-private-key); empty acts as github-actions[bot]
        type: string
        default: ""
    secrets:
      anthropic-api-key:
        description: Claude API key
        required: true
      app-private-key:
        description: Private key of the IMGAgent GitHub App
        required: false

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: imgagent-docs-writer-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Read the command
        id: cmd
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PREFIX: ${{ inputs.command }}
        run: |
          python3 - <<'PY'
          import os, re, secrets
          first = (os.environ["COMMENT_BODY"].splitlines() or [""])[0].strip()
          prefix = re.escape(os.environ["PREFIX"]).replace(r"\ ", r"\s+")
          m = re.match(prefix + r"\s+(\S+)\s*(.*)$", first, re.I)
          command, hint = (m.group(1).lower(), m.group(2).strip()) if m else ("", "")
          if command not in ("make", "update"):
              print(f"::error::Unknown command {command!r}; use make or update.")
              raise SystemExit(1)
          eof = f"EOF_{secrets.token_hex(16)}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"command={command}\nhint<<{eof}\n{hint}\n{eof}\n")
          PY

      - name: Token of IMGAgent
        id: app
        if: inputs.app-id != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - name: Acknowledge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes > /dev/null

      # Always the default branch, with full history (update looks at what changed since the docs were last edited).
      - uses: actions/checkout@v4
        with:
          path: repo
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: industrial-mathematics-group/.github
          ref: ${{ inputs.bot-ref }}
          path: bot
          sparse-checkout: imgagent
          persist-credentials: false

      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: pip install anthropic==2.8.0

      - name: Write the docs with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          DOCS_WRITER_MODEL: ${{ inputs.model }}
          DOCS_WRITER_EFFORT: ${{ inputs.effort }}
          REPO_ROOT: repo
          DOCS_PROJECT: ${{ inputs.project-name || github.event.repository.name }}
          DOCS_ABOUT: ${{ inputs.project-about || github.event.repository.description }}
          DOCS_AUDIENCE: ${{ inputs.audience }}
          COMMAND: ${{ steps.cmd.outputs.command }}
          HINT: ${{ steps.cmd.outputs.hint }}
          SUMMARY_FILE: ${{ runner.temp }}/summary.md
        run: python bot/imgagent/docs/write_docs.py "$COMMAND" "$HINT"

      - name: Open a pull request
        working-directory: repo
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          COMMAND: ${{ steps.cmd.outputs.command }}
          PREFIX: ${{ inputs.command }}
          NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.comment.user.login }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          MODEL: ${{ inputs.model }}
          SUMMARY_FILE: ${{ runner.temp }}/summary.md
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
              -f body="\`docs $COMMAND\`: $(head -n1 "$SUMMARY_FILE")" > /dev/null
            exit 0
          fi

          # Commit as the app's bot account, so the commit shows its name and avatar.
          if [ -n "$APP_SLUG" ]; then
            bot="${APP_SLUG}[bot]"
            id="$(gh api "users/$bot" --jq .id)"
            git config user.name "$bot"
            git config user.email "$id+$bot@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          branch="imgagent/docs-$COMMAND-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git add -A docs zensical.toml
          git commit -q -m "docs: $COMMAND documentation from the code" \
            -m "Written by $MODEL from the code on $BASE, requested by @$ACTOR in $COMMENT_URL"
          git push -q origin "$branch"

          case "$MODEL" in
            *opus*) family=Opus ;; *sonnet*) family=Sonnet ;; *fable*) family=Fable ;; *) family=Other ;;
          esac
          box() { [ "$family" = "$1" ] && echo x || echo " "; }
          # The organisation's PR template (.github/PULL_REQUEST_TEMPLATE.md), filled in for PR-signoff: G3 and the
          # model; the requester ticks their human review before merging.
          {
            echo "## What does this PR change?"
            echo
            echo "Requested by @$ACTOR in $COMMENT_URL (\`$PREFIX $COMMAND\`)."
            echo
            cat "$SUMMARY_FILE"
            echo
            echo "Review every page before merging: Claude was told to document only what the"
            echo "code shows, but it can still be wrong."
            echo
            echo "## AI declaration"
            echo
            echo "<!-- Opened by IMGAgent; the person who asked for it is responsible. -->"
            echo "Responsible person: @$ACTOR"
            echo
            echo "Generation (tick exactly one: the highest level of any substantial part):"
            echo "- [ ] **G0** Written by a human, without AI"
            echo "- [ ] **G1** AI-assisted: a human wrote it, AI suggested or edited parts"
            echo "- [ ] **G2** AI-generated: AI wrote substantial parts, a human directed the work and edited the result"
            echo "- [x] **G3** AI-autonomous: an agent produced it largely end to end"
            echo
            echo "AI models that wrote parts of it (G1-G3, tick all that apply):"
            echo "- [$(box Fable)] **Claude Fable** (Anthropic)"
            echo "- [$(box Opus)] **Claude Opus** (Anthropic)"
            echo "- [$(box Sonnet)] **Claude Sonnet** (Anthropic)"
            echo "- [ ] **GPT Astra** (OpenAI)"
            echo "- [ ] **GPT Sol** (OpenAI)"
            echo "- [ ] **GPT Terra** (OpenAI)"
            echo "- [$(box Other)] **Other:** $([ "$family" = Other ] && echo "$MODEL")"
            echo
            echo "Human review (at least H0 is required; the levels build on each other: tick the highest one you did):"
            echo "- [ ] **H0** I checked the result as a whole: it does what was asked, runs, and the output is plausible"
            echo "- [ ] **H1** I ran the tests or reproduced the key results myself, and read the important parts"
            echo "- [ ] **H2** I read every changed line, understand it, and checked edge cases"
            echo "- [ ] **H3** I validated it independently: new tests, a reference solution or method, or a second person's review"
            echo
            echo "AI review (only review that is independent of the session that wrote the change; the highest ticked one counts):"
            echo "- [x] **A0** No independent AI review: none, or only the checks of the session that wrote the change"
            echo "- [ ] **A1** A new AI session, without the generating conversation, checked the final change and ran the tests. Model, if not one of the above: "
            echo "- [ ] **A2** A different, capable model did that check and committed one review report. Model and report: "
            echo "- [ ] **A3** A different, capable model validated it with new evidence (new tests, benchmarks, another method), committed with the report. Model and report: "
            echo
            echo "For A2 and A3, the highest severity the review found in this change itself, as its report says (none, trivial, minor, major or critical; leave it empty for A0 and A1):"
            echo "AI-Review-Findings:"
          } > "$RUNNER_TEMP/body.md"

          url="$(gh pr create --base "$BASE" --head "$branch" \
            --title "docs: $COMMAND documentation from the code" --body-file "$RUNNER_TEMP/body.md")"
          gh pr edit "$url" --add-assignee "$ACTOR" || true
          gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
            -f body="\`docs $COMMAND\` is ready for review: $url" > /dev/null

      - name: Report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
            -f body="IMGAgent's docs writer failed, see the [run log]($RUN_URL)." > /dev/null
