# Reusable workflow: checks the AI declaration of a pull request with aisignoff and sets labels.
# Called from each repository (see workflow-templates/pr-signoff.yml).
#
# "aisignoff lint --declare-from" reads the ticked questions of the PR template (or "Key: value" lines)
# exactly as the merge commit's message will be read, and checks (see CONTRIBUTING.md and the aisignoff
# documentation, "Checking the pull request description"):
#   - the description on its own: G0-G3 (one), the highest ticked H0-H3, the highest ticked
#     A0-A3 (none: A0), the models for G1-G3, the reviewing model for A1-A3 (for A2 and A3 a model that didn't
#     write the change)
#   - for A1, A2 and A3: the line "AI-Review-Findings:" (none or a severity; any severity passes, reports show it as
#     the findings level F0-F3, aisignoff 1.0.0rc10 or later); for A2 and A3 also the review report named in the box (a file
#     the PR adds or changes, or a link; not read)
#   - the responsible human: the PR author, or the "Responsible person: @login" line for PRs opened by bots
#   - the minimum levels of the [policy] in SIGNOFF.toml of the BASE branch
#   - in repositories with SIGNOFF.toml, every file and (with [history]) every line of the merged result
#   - that the PR doesn't change [policy], version, exclude or [history] of SIGNOFF.toml, or the entries of
#     .git-blame-ignore-revs: such changes are committed
#     to main directly. A repository can let PR authors with some permissions change them (input
#     allow-policy-change); their PR is still checked under the base branch's [policy] (aisignoff 1.0.0rc4 or later)
# The declaration travels into git through the merge commit, whose message is the PR title and
# description (see SETUP.md); the "Signoff-Badges" workflow reads it from there.
#
# Security: runs on pull_request_target so it can label PRs from forks. It checks out GitHub's merge
# preview without credentials and only reads it: aisignoff is installed from PyPI before the checkout
# and runs no code of the repository.
name: PR-signoff

on:
  workflow_call:
    inputs:
      aisignoff-version:
        description: Release of aisignoff to install from PyPI; keep it at File-signoff's
        type: string
        default: "0.17.0"
      allow-policy-change:
        description: >-
          Repository permissions of PR authors who may change [policy], version, exclude or [history] of SIGNOFF.toml, or .git-blame-ignore-revs,
          in a pull request, comma-separated (admin, maintain, write); "" (the default): nobody, such changes
          are committed to main directly. Needs aisignoff 1.0.0rc4 or later, so that such a PR can't lower the bar for
          itself. The permission is the PR author's, not of whoever pushed to its branch.
        type: string
        default: ""

jobs:
  check:
    # Dependency update bots are exempt: Dependabot, and CompatHelper (github-actions[bot] on its branches
    # compathelper/*). A skipped required check counts as passed, so nothing else is: not other bots and AI
    # agents, and not other pull requests of github-actions[bot], which any workflow of the repository can
    # open.
    if: >-
      ${{ github.event.pull_request.user.login != 'dependabot[bot]' &&
          !(github.event.pull_request.user.login == 'github-actions[bot]' &&
            startsWith(github.event.pull_request.head.ref, 'compathelper/')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install aisignoff
        env:
          VERSION: ${{ inputs.aisignoff-version }}
        run: pip install "aisignoff==${VERSION}"

      - name: Check out the merge preview
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0   # the whole history: the base branch, and the lines' declarations ([history])
          persist-credentials: false

      - name: May the author change the rules?
        id: author
        uses: actions/github-script@v7
        env:
          ALLOWED: ${{ inputs.allow-policy-change }}
        with:
          script: |
            const allowed = (process.env.ALLOWED || '').split(',').map(s => s.trim()).filter(Boolean);
            const pr = context.payload.pull_request;
            let role = 'none';
            if (pr.user.type !== 'Bot') {
              try {
                role = (await github.rest.repos.getCollaboratorPermissionLevel({
                  ...context.repo, username: pr.user.login })).data.role_name;
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }
            core.setOutput('allow', allowed.includes(role) ? 'true' : 'false');

      - name: Check the declaration
        env:
          DESCRIPTION: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ALLOW: ${{ steps.author.outputs.allow }}
        run: |
          printf '%s\n' "$DESCRIPTION" > "$RUNNER_TEMP/description.md"
          # HEAD^1: the merge preview's first parent, the base branch as GitHub merged it
          args=(--declare-from "$RUNNER_TEMP/description.md" --author "$AUTHOR" --base HEAD^1)
          aisignoff report --json "${args[@]}" > "$RUNNER_TEMP/report.json" 2> "$RUNNER_TEMP/report.err" || true
          if [ "$ALLOW" = true ]; then args+=(--allow-policy-change); fi
          set +e
          aisignoff lint "${args[@]}" > "$RUNNER_TEMP/lint.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/lint.txt"
          {
            echo '### AI declaration'
            echo '```'
            cat "$RUNNER_TEMP/lint.txt"
            echo '```'
            echo 'See CONTRIBUTING.md, section "AI-assisted contributions".'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_ENV"
          exit "$status"

      - name: Set labels
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const isAiLabel = (name) => /^(ai:G[0-3]|human:H[0-3]|ai-review:A[0-3])$/.test(name);
            const current = (await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number, per_page: 100 }))
              .data.map(l => l.name);
            let pr = null;
            try {
              pr = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/report.json`, 'utf8')).pull_request;
            } catch (e) { /* no report: no labels */ }
            const valid = process.env.status === '0' && pr && pr.applies;
            const levels = valid ? [pr['AI-Generation'], pr['Human-Review'], pr['AI-Review']] : [];
            const wanted = valid && levels.every(l => /^[GHA][0-3]$/.test(l))
              ? [`ai:${levels[0]}`, `human:${levels[1]}`, `ai-review:${levels[2]}`] : [];

            const info = {
              G0: ['389826', 'Human-written'], G1: ['4063D8', 'AI-assisted'], G2: ['9558B2', 'AI-generated'], G3: ['CB3C33', 'AI-autonomous'],
              H0: ['C9D1E4', 'Human: plausibility check'], H1: ['9AA3B8', 'Human: tested'], H2: ['5A6378', 'Human: reviewed line by line'], H3: ['1B2238', 'Human: independently validated'],
              A0: ['EDEDED', 'No independent AI review'], A1: ['F3E0C2', 'AI: context-free check'], A2: ['E8B86D', 'AI: check by a different model'], A3: ['8A5A0B', 'AI: validated by a different model'],
            };
            for (const name of wanted) {
              const [color, description] = info[name.split(':')[1]];
              let existing = null;
              try {
                existing = (await github.rest.issues.getLabel({ owner, repo, name })).data;
              } catch (e) {
                if (e.status !== 404) throw e;
              }
              if (!existing) {
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              } else if (existing.description !== description || existing.color.toLowerCase() !== color.toLowerCase()) {
                await github.rest.issues.updateLabel({ owner, repo, name, color, description });   // edited by hand
              }
            }
            // labels from an earlier version of the description no longer apply
            for (const name of current.filter(n => isAiLabel(n) && !wanted.includes(n))) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
            }
            if (wanted.length) await github.rest.issues.addLabels({ owner, repo, issue_number, labels: wanted });
