# Reusable workflow: summarises the AI declarations in the history of the default branch
# and publishes three shields.io endpoint badges to the orphan branch "badges":
#   ai-generation.json    e.g. "G0 40% · G1 35% · G2 25%"
#   ai-human-review.json  e.g. "H1 30% · H2 60% · H3 10%"
#   ai-review.json        e.g. "A0 40% · A1 20% · A2 40%"
# The declaration of a merged PR is read from its merge commit, whose message is the PR title
# and description (see SETUP.md): the ticked G, H and A questions of the PR template, or "Key: value"
# lines. "aisignoff badge --commits" reads them exactly as PR-signoff read the description, including the
# trailers and templates of earlier policies; commits without a declaration (from before the policy) are
# not counted, and the job summary says how many are.
# Needs no SIGNOFF.toml. aisignoff's version is the organisation's (actions/setup-aisignoff).
name: Signoff-Badges

on:
  workflow_call:
    inputs:
      aisignoff-version:
        description: Release of aisignoff to install from PyPI (0.24.0 or later); empty (the default) is the organisation's version
        type: string
        default: ""
      runs-on:
        description: >-
          Runner for the job: a label such as ubuntu-latest (the default) or aisignoff (a self-hosted runner),
          or JSON for several labels or a runner group, e.g. ["self-hosted", "aisignoff"]; empty is ubuntu-latest.
          See SETUP.md, "Self-hosted runner".
        type: string
        default: ubuntu-latest

jobs:
  badge:
    runs-on: ${{ (startsWith(inputs.runs-on, '[') || startsWith(inputs.runs-on, '{')) && fromJSON(inputs.runs-on) || inputs.runs-on || 'ubuntu-latest' }}
    permissions:
      contents: write
    concurrency:
      group: ai-badge-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7  # zizmor: ignore[artipacked] the badges branch is pushed with these credentials
        with:
          fetch-depth: 0
      - uses: industrial-mathematics-group/.github/actions/setup-aisignoff@main
        with:
          version: ${{ inputs.aisignoff-version }}
          cache: "false"   # only reads commit messages, never blames
      - name: Count declarations
        run: aisignoff badge --commits --markdown --out "$RUNNER_TEMP/ai-badges" >> "$GITHUB_STEP_SUMMARY"
      - uses: industrial-mathematics-group/.github/actions/publish-badges@main
        with:
          files: ai-generation.json ai-human-review.json ai-review.json
          source: ${{ runner.temp }}/ai-badges
          message: Update AI declaration badges
