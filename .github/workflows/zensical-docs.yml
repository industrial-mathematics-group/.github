# Reusable workflow: builds a repository's documentation site with Zensical (docs/ + zensical.toml) and
# publishes it on GitHub Pages. Called from each repository (see workflow-templates/zensical-docs.yml).
#
#   build   every run: installs a pinned Zensical and runs "zensical build --clean", so a pull request shows a
#           broken page or config before the merge. In a repository with SIGNOFF.toml it adds aisignoff's
#           interactive folder report to the site, at <site>/signoff/ (input signoff-report-path); on a pull
#           request the lines it changes are marked, and the built site is uploaded as the artifact "site"
#   deploy  pushes to the default branch and manual runs: uploads site/ and deploys it to GitHub Pages, at
#           https://<owner>.github.io/<repo>/ (set that as site_url in zensical.toml)
#
# Works with the site "@IMGAgent docs make" writes (docs/ and zensical.toml, see IMGAgent's ZENSICAL.md).
# One-time setup per repository: Settings → Pages → Source: "GitHub Actions".
# Security: no secrets; the repository's Markdown and config are only read by Zensical, nothing else runs.
name: Zensical docs

on:
  workflow_call:
    inputs:
      zensical-version:
        description: Release of Zensical to install from PyPI (pinned, so a new release can't break the build unannounced)
        type: string
        default: "0.1.3"
      python-version:
        description: Python for Zensical
        type: string
        default: "3.13"
      signoff-report:
        description: Add aisignoff's folder report to the site (repositories with SIGNOFF.toml)
        type: boolean
        default: true
      signoff-report-path:
        description: Folder of the site for the report ("signoff" is https://<owner>.github.io/<repo>/signoff/)
        type: string
        default: signoff
      aisignoff-version:
        description: Release of aisignoff for the report; empty (the default) is the organisation's version
        type: string
        default: ""
      deploy:
        description: Publish on GitHub Pages (pushes to the default branch and manual runs); false only builds
        type: boolean
        default: true
      runs-on:
        description: >-
          Runner for both jobs (build and deploy): a label such as ubuntu-latest (the default) or private-runner (the
          organisation's self-hosted runner, for private repositories only), or JSON for several labels or a
          runner group, e.g. ["self-hosted", "linux"]; empty is ubuntu-latest.
          See SETUP.md, "Self-hosted runner".
        type: string
        default: ubuntu-latest

jobs:
  build:
    runs-on: ${{ (startsWith(inputs.runs-on, '[') || startsWith(inputs.runs-on, '{')) && fromJSON(inputs.runs-on) || inputs.runs-on || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the whole history, for the report's line-by-line declarations ([history])
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install Zensical
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ inputs.zensical-version }}
        run: python -m pip install --disable-pip-version-check -q "zensical==${VERSION}"
      - name: Build the site
        run: |
          if [ ! -f zensical.toml ]; then
            echo "::error::No zensical.toml in this repository. Write '@IMGAgent docs make' in an issue, or run 'zensical new'."
            exit 1
          fi
          zensical build --clean
      - name: Look for SIGNOFF.toml
        id: signoff
        if: inputs.signoff-report
        env:
          REPORT_PATH: ${{ inputs.signoff-report-path }}
        run: |
          if [ ! -f SIGNOFF.toml ]; then echo "report=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          P="${REPORT_PATH#/}"; P="${P%/}"
          if ! [[ "$P" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] || [[ "/$P/" == */../* || "/$P/" == */./* ]]; then
            echo "::error::signoff-report-path must be a folder like signoff, not '$REPORT_PATH'"
            exit 1
          fi
          echo "report=true" >> "$GITHUB_OUTPUT"
          echo "path=$P" >> "$GITHUB_OUTPUT"
      - uses: industrial-mathematics-group/.github/actions/setup-aisignoff@main
        if: steps.signoff.outputs.report == 'true'
        with:
          version: ${{ inputs.aisignoff-version }}
          cache: restore   # File-signoff keeps the cache up to date
      - name: Add the signoff report to the site
        if: steps.signoff.outputs.report == 'true'
        env:
          EVENT: ${{ github.event_name }}
          REPORT: site/${{ steps.signoff.outputs.path }}/index.html
          TITLE: ${{ github.event.repository.name }}
        run: |
          # a pull request marks the lines it changes: since the merge preview's first parent
          SINCE=""
          if [ "$EVENT" = pull_request ]; then SINCE=HEAD^1; fi
          # the site still deploys when the report can't be written (File-signoff reports the problem)
          if aisignoff report --html "$REPORT" --title "$TITLE" --with-source ${SINCE:+--since "$SINCE"}; then
            { echo '### AI signoff report'; echo; echo "Added to the site at \`${REPORT#site/}\`."; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=AI signoff report::Couldn't write the report; the site is built without it."
          fi
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: site
          path: site
      - uses: actions/upload-pages-artifact@v5
        if: inputs.deploy && github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    needs: build
    if: inputs.deploy && github.event_name != 'pull_request'
    runs-on: ${{ (startsWith(inputs.runs-on, '[') || startsWith(inputs.runs-on, '{')) && fromJSON(inputs.runs-on) || inputs.runs-on || 'ubuntu-latest' }}
    permissions:
      pages: write      # deploy to GitHub Pages
      id-token: write   # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-${{ github.repository }}
      cancel-in-progress: false   # let a running deployment finish
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
