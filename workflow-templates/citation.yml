name: Citation

# Checks CITATION.cff (GitHub's "Cite this repository", Zenodo) against the Citation File Format schema.
on:
  push:
    branches: [$default-branch]
    paths: [CITATION.cff]
  pull_request:
    paths: [CITATION.cff]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  citation:
    uses: industrial-mathematics-group/.github/.github/workflows/citation.yml@main
    # with:
    #   runs-on: aisignoff   # a self-hosted runner (private repositories, see SETUP.md)
