name: IMGAgent

# The organisation's bot, IMGAgent: one GitHub App that answers commands in issues and comments.
#   @IMGAgent signoff <in your own words>   record how files were made and reviewed (SIGNOFF.toml pull request)
#   @IMGAgent docs ask <question>           answer from the docs in docs/
#   @IMGAgent docs make [hint]              rebuild docs/ from the code, as a pull request
#   @IMGAgent docs update [hint]            fix only what is outdated in docs/, as a pull request
# The jobs live in industrial-mathematics-group/.github; this file only decides which one runs. Delete the jobs
# this repository doesn't use (docs make / update need a Zensical site: docs/ and zensical.toml).
# Needs the organisation variable IMGAGENT_APP_ID and the secrets IMGAGENT_PRIVATE_KEY and ANTHROPIC_API_KEY
# (SETUP.md, "IMGAgent"). Without the app variable, the jobs act as github-actions[bot].
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  signoff:
    # "@IMGAgent signoff" in a new issue or a comment by a person, not in issues made with the form or in pull
    # requests. The assistant itself checks that the person has write access.
    if: >-
      github.event.sender.type != 'Bot' &&
      ((github.event_name == 'issues' && contains(github.event.issue.body, '@IMGAgent signoff') &&
        !contains(github.event.issue.body, '### What should be recorded?')) ||
       (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
        github.event.issue.state == 'open' && contains(github.event.comment.body, '@IMGAgent signoff') &&
        !contains(github.event.issue.body, '### What should be recorded?')))
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    uses: industrial-mathematics-group/.github/.github/workflows/signoff-assistant.yml@main
    with:
      command: "@IMGAgent signoff"
      app-id: ${{ vars.IMGAGENT_APP_ID }}
    #   model: claude-opus-5-5                    # a stronger model for this repository
    #   model-name: Claude Opus 5.5 (Anthropic)   # keep in step with model
    #   dispatch-workflows: file-signoff.yml      # as in your Signoff-Request caller
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      app-private-key: ${{ secrets.IMGAGENT_PRIVATE_KEY }}

  docs-ask:
    # "@IMGAgent docs ask" at the start of a comment, or anywhere in a new issue; only people with write access
    if: >-
      github.event.sender.type != 'Bot' &&
      ((github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '@IMGAgent docs ask') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
       (github.event_name == 'issues' &&
        (contains(github.event.issue.title, '@IMGAgent docs ask') || contains(github.event.issue.body, '@IMGAgent docs ask')) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)))
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: industrial-mathematics-group/.github/.github/workflows/imgagent-docs-ask.yml@main
    with:
      app-id: ${{ vars.IMGAGENT_APP_ID }}
    #   docs-url: https://example.org/docs/   # where the site is published; default <owner>.github.io/<repo>
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      app-private-key: ${{ secrets.IMGAGENT_PRIVATE_KEY }}

  docs-write:
    # "@IMGAgent docs make" or "@IMGAgent docs update" at the start of a comment; only people with write access
    if: >-
      github.event_name == 'issue_comment' && github.event.sender.type != 'Bot' &&
      (startsWith(github.event.comment.body, '@IMGAgent docs make') ||
       startsWith(github.event.comment.body, '@IMGAgent docs update')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: industrial-mathematics-group/.github/.github/workflows/imgagent-docs-writer.yml@main
    with:
      app-id: ${{ vars.IMGAGENT_APP_ID }}
    #   model: claude-opus-5-5
    #   audience: people who deploy and run it on their own Linux machines
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      app-private-key: ${{ secrets.IMGAGENT_PRIVATE_KEY }}
