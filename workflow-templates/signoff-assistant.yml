name: Signoff-Assistant

# The @signoff assistant: "@signoff" and a request in plain words, in a new issue or a comment, become the
# answers of the signoff request form (Claude API), or questions about what is missing; complete answers go
# to Signoff-Request, which opens the pull request. Needs Signoff-Request and the organisation secret
# ANTHROPIC_API_KEY for this repository; without it, "@signoff" gets a comment that points to the form.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  signoff-assistant:
    # "@signoff" in a new issue or a comment by a person, not in issues made with the form or pull requests
    if: >-
      (github.event_name == 'issues' && contains(github.event.issue.body, '@signoff') &&
       !contains(github.event.issue.body, '### What should be recorded?')) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       github.event.issue.state == 'open' && contains(github.event.comment.body, '@signoff') &&
       github.event.comment.user.type != 'Bot' && !contains(github.event.issue.body, '### What should be recorded?'))
    uses: industrial-mathematics-group/.github/.github/workflows/signoff-assistant.yml@main
    with:
      app-id: ${{ vars.SIGNOFF_APP_ID }}   # the organisation's signoff bot app; empty: github-actions[bot]
    #   model: claude-opus-5-5                    # a stronger model for this repository
    #   model-name: Claude Opus 5.5 (Anthropic)   # keep in step with model
    #   dispatch-workflows: file-signoff.yml      # as in your Signoff-Request caller
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      app-private-key: ${{ secrets.SIGNOFF_APP_PRIVATE_KEY }}
